# Optional Docker setup. `docker compose up --build` then open http://localhost:8000
services:
  ai-world:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Pass provider keys through from your shell / .env if you want cloud models.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # To reach an Ollama running on the host from inside the container:
      # - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    volumes:
      # Persist SQLite state and the Obsidian vault across restarts.
      - ./data:/app/data
      - ./obsidian:/app/obsidian
