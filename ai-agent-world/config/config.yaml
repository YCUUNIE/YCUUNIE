# AI Agent World — main configuration.
# Secrets (API keys) never go here — put them in .env. See .env.example.

simulation:
  tick_rate: 10          # world ticks per second (movement/scheduling)
  default_speed: 1       # 1 | 2 | 5 | 10
  max_agents: 20
  autostart: true        # start the simulation automatically on boot

world:
  width: 1600
  height: 1200

memory:
  provider: obsidian     # obsidian | sqlite

obsidian:
  vault_path: ""         # absolute path to your vault; empty = ./obsidian (bundled demo vault)
  root_folder: AI-Agents

llm:
  concurrency: 3         # max simultaneous LLM calls across ALL agents
  timeout_seconds: 30
  max_retries: 2

# Enable/disable providers and set endpoints. `local` needs nothing and always
# works offline. Override any base_url with <PROVIDER>_BASE_URL in the env.
providers:
  local:
    enabled: true
  openai:
    enabled: true
    base_url: "https://api.openai.com/v1"
  anthropic:
    enabled: true
    base_url: "https://api.anthropic.com/v1"
  gemini:
    enabled: true
    base_url: "https://generativelanguage.googleapis.com/v1beta"
  openrouter:
    enabled: true
    base_url: "https://openrouter.ai/api/v1"
  ollama:
    enabled: true
    base_url: "http://localhost:11434/v1"
  lmstudio:
    enabled: true
    base_url: "http://localhost:1234/v1"
  vllm:
    enabled: true
    base_url: "http://localhost:8000/v1"
  localai:
    enabled: true
    base_url: "http://localhost:8080/v1"
  custom:
    enabled: true
    base_url: "http://localhost:8000/v1"
